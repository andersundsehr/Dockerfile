location ~ \.php$ {
    # only scripts that exist, so that Nginx answers a missing one itself, with its error page
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME     $request_filename;
    # the requested host name, as in Apache, not the first server_name, which is "_"
    fastcgi_param SERVER_NAME         $host;
    fastcgi_read_timeout <PHP_TIMEOUT>;
}
