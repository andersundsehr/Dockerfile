# Settings
TimeOut      1000
ServerName   "<SERVERNAME>"
# no version and operating system in the Server header and on the error pages
ServerTokens    Prod
ServerSignature Off

DirectoryIndex <DOCUMENT_INDEX>
DocumentRoot "<DOCUMENT_ROOT>"

<Directory "<DOCUMENT_ROOT>">
  Options FollowSymLinks
  AllowOverride All

  <IfVersion < 2.4>
      Allow from all
  </IfVersion>
  <IfVersion >= 2.4>
      Require all granted
  </IfVersion>
</Directory>
