location ~ \.php$ {
    # only scripts that exist, so that Nginx answers a missing one itself, with its error page
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME     $request_filename;
    fastcgi_read_timeout <PHP_TIMEOUT>;
}
